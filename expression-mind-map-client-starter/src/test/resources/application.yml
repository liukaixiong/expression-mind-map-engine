spring:
  plugin:
    express:
      debug: true
      remote-engine-url: http://localhost:20888
      # 默认的输出日志框架的级别
      logger-trace-level: info
      # 表达式调用
      expression-config-call: http_cache
      enable-trace-log: true
      inject-type-package: com.smp.service.function.control
  application:
    name: expression-mind-map-client
  main:
    allow-bean-definition-overriding: true
    allow-circular-references: true
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      # 密码(如没有密码请注释掉)
      database: 0
      timeout: 10s

server:
  port: 9898
debug: true
