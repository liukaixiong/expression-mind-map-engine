<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>表达式表单</title>
    <link href="/js/cdn/layui/css/layui.css" rel="stylesheet">
    <script src="/js/cdn/layui/layui.js"></script>

    <!-- Ace Editor - 本地版本 -->
    <script src="/js/cdn/ace/ace.min.js"></script>
    <script src="/js/cdn/ace/mode-javascript.min.js"></script>
    <script src="/js/cdn/ace/theme-chrome.min.js"></script>
    <script src="/js/cdn/ace/ext-language_tools.min.js"></script>
    <script src="/js/cdn/ace/ext-error_marker.min.js"></script>
    <script src="/js/cdn/jquery-3.3.1.min.js"></script>
    <script src="/js/cdn/json-viewer/jquery.json-viewer.js"></script>
    <link href="/js/cdn/json-viewer/jquery.json-viewer.css" type="text/css" rel="stylesheet">

    <script src="/js/Utils.js"></script>
    <script src="/js/engine-const.js"></script>
    <script src="/js/ace-expression-editor.js"></script>
    <style>
        /* Ace Editor 基础样式 */
        #expressionEditor {
            height: 200px;
            font-size: 14px;
            line-height: 1.5;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        /* Ace Editor 补全提示框样式 - 使用 Ace 内置的文档显示 */
        /* 注意：Ace Editor 1.32.2 会自动处理补全文档的显示 */
        /* 这里只做最小的样式调整，避免覆盖默认行为 */
        .ace_editor.ace_autocomplete {
            z-index: 999999;  /* 确保补全框在最上层 */
        }
    </style>
</head>
<body>
<div id="exp-form-data" style="padding-left: 50px;padding-top: 50px">
    <form action="" class="layui-form layui-form-pane" lay-filter="expression-form">
        <div class="layui-form-item">
            <label class="layui-form-label">表达式类型</label>
            <div class="layui-input-block">
                <select lay-filter="expressType" name="expressionType">
                    <option selected value="action">行为【适合场景: 配置业务类型,明确业务场景】</option>
                    <option value="condition">规则【适合场景: 配置业务规则，匹配业务场景】</option>
                    <option value="trigger">触发【适合场景: 配置业务操作，执行业务场景】</option>
                    <option value="callback">回调【适合场景: 配置回调操作，适合通知类场景】</option>
                </select>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">表达式编码</label>
            <div class="layui-col-md8">
                <input autoComplete="off" class="layui-input" lay-verify="required"
                       name="expressionCode"
                       placeholder="请输入编码，该字段用于标识该规则编码，方便后续通过编码查询该表达式是否满足"
                       type="text"/>
            </div>
            <div class="layui-col-md3">
                <button class="layui-btn layui-btn-radius" id="expressionCode-gen" onclick="refreshCode()"
                        type="button">
                    <i class="layui-icon layui-icon-refresh-3"></i>
                </button>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">表达式标题</label>
            <div class="layui-input-block">
                <input autoComplete="off" class="layui-input" lay-verify="required"
                       name="expressionTitle"
                       placeholder="请输入表达式标题，用于中文描述该规则的简称，或者你也可以理解为任务名称"
                       type="text"/>
            </div>
        </div>
        <div class="layui-form-item layui-form-text">
            <label class="layui-form-label" style="height: 52px">表达式内容
                <i class="layui-icon layui-icon-tips" style="padding-top: 10px;padding-left: 10px; color: #16baaa">【快捷键:Ctrl+ALT+空格
                    或者 F4 ,会检索当前光标直至上一个空格位置中间的关键字进行检索】</i>
                <span id="sample_pre_div">
                    <i class="layui-icon layui-icon-fire" style="color: #16baaa">
                        <button class="layui-btn layui-btn-radius" id="expression_translate_body"
                                onclick="getExpressionTranslateBody()" type="button">
                            查看表达式详情
                        </button>
                        <button class="layui-btn layui-btn-radius" id="expression_sample_body"
                                onclick="getExpressionSampleBody()" type="button">
                            查看样本参数
                        </button>
                        <button class="layui-btn layui-btn-radius" id="expression_sample_link"
                                onclick="linkExpressionSampleBody()" type="button">
                            跳转追踪示例
                        </button>
                        <button class="layui-btn layui-btn-radius layui-btn-warm" id="expression_history_btn"
                                onclick="openExpressionHistory()" type="button">
                            查看历史版本
                        </button>
                    </i>
                </span>
            </label>
            <div class="layui-input-block">
                <!-- 隐藏的原始输入框，用于表单提交 -->
                <textarea class="layui-hide" id="expression_input_search"
                          name="expressionContent"></textarea>
                <!-- Ace Editor 容器 -->
                <div id="expressionEditor"></div>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">表达式描述</label>
            <div class="layui-input-block">
                <input autoComplete="off" class="layui-input" name="expressionDescription" placeholder="请输入"
                       type="text"/>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">优先级</label>
            <div class="layui-col-md3">
                <input autoComplete="off" class="layui-input" lay-verify="required"
                       name="priorityOrder"
                       placeholder="请输入优先级顺序,数值越高,优先级越高"
                       type="number"/>
            </div>
            <div class="layui-col-md3" style="padding-top: 10px;padding-left: 10px; color: #16baaa">
                <i class="layui-icon layui-icon-tips "></i>数值越高,优先级越高
            </div>
        </div>
        <div class="layui-form-item layui-form-text">
            <label class="layui-form-label">能力开关</label>
            <div class="layui-input-block">
                <input lay-filter="configurability-checkbox-filter" lay-skin="tag" name="enableNodeAsync"
                       title="开启子分支异步" type="checkbox"/>
                <input lay-filter="configurability-checkbox-filter" lay-skin="tag" name="enableGlobalLock"
                       title="启用全局锁" type="checkbox"/>
                <input lay-filter="configurability-checkbox-filter" lay-skin="tag" name="enableCache"
                       title="启用远端缓存" type="checkbox"/>
                <input lay-filter="configurability-checkbox-filter" lay-skin="tag" name="enableExceptionSkip"
                       title="启用异常跳过" type="checkbox"/>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">表达式状态</label>
            <div class="layui-input-inline">
                <select lay-filter="expressionStatus" name="expressionStatus">
                    <option selected value="1">有效</option>
                    <option value="0">无效</option>
                </select>
            </div>
        </div>
        <div class="layui-form-item">
            <button class="layui-btn" lay-filter="demo1" lay-submit>确认</button>
            <button class="layui-btn layui-btn-primary" type="reset">重置</button>
        </div>
    </form>
</div>
<pre id="json-renderer"></pre>
</body>
<script type="text/javascript">
    var layer = layui.layer;
    var form = layui.form;
    var util = layui.util
    let requestParam = engineUtils.getRequestParams();
    var expressionTypeList = final_const.final_constants.expression_type_list;
    let dataId = requestParam["id"];
    let executorId = requestParam.executorId;
    let api_add_path = final_const.api_path.expression_add;
    let api_edit_path = final_const.api_path.expression_edit;
    let api_expressionFindExpressionInfo = final_const.api_path.expression_findExpressionInfo;
    let api_trace_sample_object = final_const.api_path.trace_sample_object;
    let api_executor_doc_translate_list = final_const.api_path.executor_doc_translate_list;
    let api_executor_doc_search_list = final_const.api_path.executor_doc_search_list;
    // 复选框 - 选择暂存结果
    let configurabilityEnableArray = new Set();
    // 配置开关能力记录,新增的能力需要注册到该配置中
    let configurabilityJson = {};
    let serviceName = null;

    // 代表修改
    if (dataId) {
        let url = api_expressionFindExpressionInfo + "?id=" + dataId;
        engineUtils.requestPost(url, {}, function (response) {
            let defaultData = response.data;
            let configurabilityJson = defaultData['configurabilityJson'];
            if (configurabilityJson) {
                let configJson = JSON.parse(configurabilityJson);
                if (configJson && configJson.enableSwitch) {
                    configJson.enableSwitch.forEach(function (item) {
                        // 初始化配置开关中的复选框
                        defaultData[item] = true;
                        // 暂存事件
                        configurabilityEnableArray.add(item);
                    });
                }
            }
            form.val('expression-form', defaultData);
            // 数据加载完成后更新编辑器内容
            setTimeout(function () {
                if (expressionEditor && defaultData.expressionContent) {
                    expressionEditor.setValue(defaultData.expressionContent, -1);
                }
            }, 100);
        })
    } else {
        // 代表新增逻辑
        let nextExpressionTypeIndex = Math.min(expressionTypeList.indexOf(requestParam.expressionType) + 1, 3);
        form.val('expression-form', {
            'expressionType': expressionTypeList[nextExpressionTypeIndex],
            'priorityOrder': 100,
        });
        refreshCode();
        $("#sample_pre_div").remove();
    }

    form.on('checkbox(configurability-checkbox-filter)', function (data) {
        console.log(this.value); // 当前点击的checkbox的value值
        let name = data.elem.name;
        this.checked ? configurabilityEnableArray.add(name) : configurabilityEnableArray.delete(name);
    });

    // ========================================
    // 初始化 Ace Editor 表达式编辑器
    // ========================================
    let expressionEditor = null;

    $(document).ready(function () {
        // 创建编辑器实例
        expressionEditor = new AceExpressionEditor({
            containerId: 'expressionEditor',
            textareaId: 'expression_input_search',
            executorId: executorId,
            expressionId: dataId,
            apiPath: api_executor_doc_search_list,
            height: '200px',
            theme: 'ace/theme/chrome',
            mode: 'ace/mode/javascript',
            fontSize: '14px',
            enableLiveAutocompletion: true,
            enableBasicAutocompletion: true
        });

        // 初始化编辑器
        expressionEditor.init();
    });

    // 刷新编码
    function refreshCode() {
        form.val('expression-form', {
            'expressionCode': generateRandomString(10),
        })
    }

    function getExpressionSampleBody() {
        if (dataId) {
            let jsonConfig = {collapsed: false, withQuotes: true, withLinks: true}
            engineUtils.requestPost(api_trace_sample_object + "?expressionId=" + dataId, {}, function (response) {
                if (response.code === 200) {
                    let data = response.data || {'envBody': '{}'};
                    showJsonView(data.envBody);
                } else {
                    layer.msg(response.message);
                }
            })
        }
    }

    function showJsonView(data) {
        let jsonConfig = {collapsed: false, withQuotes: true, withLinks: true}
        let jsonBody = data;
        if (typeof data === 'string') {
            jsonBody = JSON.parse(data);
        }
        $('#json-renderer').jsonViewer(jsonBody, jsonConfig);
        layer.open({
            title: '查看表达式详情',
            type: 1,
            offset: 'r',
            anim: 'slideLeft', // 从右往左
            area: ['320px', '100%'],
            shade: 0.1,
            shadeClose: true,
            content: $('#json-renderer').show()
        });
    }

    /**
     * 获取表达式翻译详情
     */
    function getExpressionTranslateBody() {
        if (dataId) {
            engineUtils.requestPost(api_executor_doc_translate_list + "?expressionId=" + dataId, {}, function (response) {
                if (response.code === 200) {
                    let data = response.data || [];
                    showJsonView(data);
                } else {
                    layer.msg(response.message);
                }
            })
        }
    }

    function linkExpressionSampleBody() {
        engineUtils.requestPost(api_trace_sample_object + "?expressionId=" + dataId, {}, function (response) {
            if (response.code === 200) {
                if (!response.data) {
                    layer.msg('没有找到对应的追踪信息!');
                    return;
                }
                let data = response.data;
                util.openWin({
                    url: `/template/expression-rule-config.html?traceLogId=${data.id}&executorId=${data.executorId}&executorCode=${data.executorCode}&executorDescription=${encodeURIComponent(data.executorName)}`
                });
            } else {
                layer.msg(response.message);
            }
        })
    }

    // 提交事件
    form.on('submit(demo1)', function (data) {
        let field = data.field; // 获取表单字段值

        field['executorId'] = requestParam.executorId;
        field['parentId'] = requestParam.parentId;
        configurabilityJson['enableSwitch'] = Array.from(configurabilityEnableArray);
        field['configurabilityJson'] = JSON.stringify(configurabilityJson);

        let submitUrl = api_add_path;
        if (dataId) {
            field['id'] = dataId;
            submitUrl = api_edit_path;
        }

        engineUtils.requestPost(submitUrl, field, function (response) {
            // 请求成功时的回调函数
            console.log(response);

            if (response.code === 200) {
                field["id"] = response.data.id;
                layer.alert('操作成功!', {
                    icon: 6,
                    title: '提示'
                }, function (index, layero, that) {
                    parent.reloadMind();
                    parent.layer.closeAll(); // 关闭弹层
                });
            } else {
                layer.alert(response.message, {
                    title: '错误提示'
                });
                parent.reloadMind();
            }
        })

        // 此处可执行 Ajax 等操作
        // …
        return false; // 阻止默认 form 跳转
    });

    // 生成指定长度的随机字符串
    function generateRandomString(length) {
        const characters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
        let result = '';
        for (let i = 0; i < length; i++) {
            result += characters.charAt(Math.floor(Math.random() * characters.length));
        }
        return result;
    }

    // ========================================
    // 表达式历史版本相关函数
    // ========================================
    let api_expression_history_list = final_const.api_path.expression_history_list;
    let api_expression_history_detail = final_const.api_path.expression_history_detail;

    /**
     * 打开历史版本弹窗
     */
    function openExpressionHistory() {
        if (!dataId) {
            layer.msg('请先保存表达式后再查看历史版本！');
            return;
        }

        engineUtils.requestPost(api_expression_history_list + "?expressionId=" + dataId, {}, function (response) {
            if (response.code === 200) {
                let historyList = response.data || [];
                showHistoryDialog(historyList);
            } else {
                layer.msg(response.message);
            }
        });
    }

    /**
     * 显示历史版本弹窗
     */
    function showHistoryDialog(historyList) {
        if (historyList.length === 0) {
            layer.msg('暂无历史版本记录');
            return;
        }

        // 构建表格HTML
        let tableHtml = `
            <div style="padding: 20px;">
                <table class="layui-table" lay-skin="line">
                    <thead>
                        <tr>
                            <th>版本号</th>
                            <th>变更类型</th>
                            <th>操作人</th>
                            <th>时间</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${historyList.map(item => `
                            <tr>
                                <td>V${item.versionNo}</td>
                                <td>${getChangeTypeBadge(item.changeType)}</td>
                                <td>${item.operator || '-'}</td>
                                <td>${formatDateTime(item.createTime)}</td>
                                <td>
                                    <button class="layui-btn layui-btn-xs"
                                            onclick="previewVersion(${item.versionNo})">
                                        预览
                                    </button>
                                    <button class="layui-btn layui-btn-xs layui-btn-normal"
                                            onclick="restoreVersion(${item.versionNo})">
                                        恢复
                                    </button>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            </div>
        `;

        layer.open({
            type: 1,
            title: '表达式历史版本',
            area: ['800px', '600px'],
            shadeClose: true,
            content: tableHtml,
            btn: ['关闭'],
            yes: function(index) {
                layer.close(index);
            }
        });
    }

    /**
     * 预览版本内容
     */
    function previewVersion(versionNo) {
        engineUtils.requestPost(
            api_expression_history_detail + "?expressionId=" + dataId + "&versionNo=" + versionNo,
            {},
            function (response) {
                if (response.code === 200) {
                    let history = response.data;
                    let contentHtml = `
                        <div style="padding: 20px;">
                            <fieldset class="layui-elem-field">
                                <legend>版本信息</legend>
                                <div class="layui-field-box">
                                    <p><strong>版本号：</strong>V${history.versionNo}</p>
                                    <p><strong>变更类型：</strong>${history.changeType}</p>
                                    <p><strong>操作人：</strong>${history.operator || '-'}</p>
                                    <p><strong>时间：</strong>${formatDateTime(history.createTime)}</p>
                                    ${history.changeReason ? `<p><strong>变更原因：</strong>${history.changeReason}</p>` : ''}
                                </div>
                            </fieldset>
                            <fieldset class="layui-elem-field">
                                <legend>表达式内容</legend>
                                <div class="layui-field-box">
                                    <pre style="background: #f6f6f6; padding: 10px; border-radius: 4px; overflow-x: auto;">${escapeHtml(history.expressionContent)}</pre>
                                </div>
                            </fieldset>
                        </div>
                    `;
                    layer.open({
                        type: 1,
                        title: '历史版本详情',
                        area: ['700px', '500px'],
                        shadeClose: true,
                        content: contentHtml
                    });
                }
            }
        );
    }

    /**
     * 恢复版本到编辑器
     */
    function restoreVersion(versionNo) {
        layer.confirm('确定要将此版本内容恢复到编辑器吗？当前内容将被覆盖。', {icon: 3, title: '确认恢复'}, function(index) {
            engineUtils.requestPost(
                api_expression_history_detail + "?expressionId=" + dataId + "&versionNo=" + versionNo,
                {},
                function (response) {
                    if (response.code === 200) {
                        let history = response.data;
                        // 将历史内容设置到编辑器
                        expressionEditor.setValue(history.expressionContent, -1);
                        layer.msg('版本内容已恢复到编辑器，请检查后保存');
                        layer.close(index);
                        // 关闭历史版本弹窗
                        layer.closeAll('page');
                    }
                }
            );
        });
    }

    /**
     * 格式化日期时间
     */
    function formatDateTime(dateStr) {
        if (!dateStr) return '-';
        let date = new Date(dateStr);
        return date.toLocaleString('zh-CN', {
            year: 'numeric',
            month: '2-digit',
            day: '2-digit',
            hour: '2-digit',
            minute: '2-digit'
        });
    }

    /**
     * HTML 转义
     */
    function escapeHtml(text) {
        if (!text) return '';
        return text.replace(/&/g, "&amp;")
                   .replace(/</g, "&lt;")
                   .replace(/>/g, "&gt;")
                   .replace(/"/g, "&quot;")
                   .replace(/'/g, "&#039;");
    }

    /**
     * 获取变更类型徽章
     */
    function getChangeTypeBadge(changeType) {
        const badges = {
            'CREATE': '<span class="layui-badge layui-bg-green">创建</span>',
            'UPDATE': '<span class="layui-badge layui-bg-blue">更新</span>',
            'DELETE': '<span class="layui-badge layui-bg-red">删除</span>'
        };
        return badges[changeType] || changeType;
    }
</script>
</html>
