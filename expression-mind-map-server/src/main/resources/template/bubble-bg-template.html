<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>气泡背景页面模板</title>
    <!-- 气泡背景CSS -->
    <link href="/css/bubble-animation.css" rel="stylesheet">
    <!-- 气泡背景JS -->
    <script src="/js/bubble-animation.js"></script>
</head>
<!-- 添加 bubble-bg 类启用气泡背景 -->
<body class="bubble-bg">

<div id="bubbleContainer"></div>

<div class="content">

    <p>所有内容会自动显示在气泡上方</p>
</div>

</body>
</html>
