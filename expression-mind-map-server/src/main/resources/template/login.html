<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>表达式引擎中枢</title>
    <script src="/js/cdn/layui/layui.js"></script>
    <link href="/js/cdn/layui/css/layui.css" rel="stylesheet">
    <script src="/js/Utils.js"></script>
    <script src="/js/engine-const.js"></script>
    <!-- 引入通用气泡背景 -->
    <script src="/js/bubble-animation.js"></script>
    <link href="/css/bubble-animation.css" rel="stylesheet">
    <style>
        /* 登录页特有样式 */
        :root {
            --mindmap-line: #94a3b8;
        }

        /* body的基础样式已由bubble-animation.css提供，这里只添加登录页特有的overflow */
        body.bubble-bg {
            overflow: hidden;
        }

        /* 登录页特有的点动画背景 */
        body.bubble-bg::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(128, 0, 128, 0.3) 10%, transparent 10.01%);
            background-size: 20px 20px;
            z-index: -1;
            animation: moveDots 5s linear infinite;
        }

        @keyframes moveDots {
            0% {
                background-position: 0 0;
            }
            100% {
                background-position: 20px 20px;
            }
        }

        /* 思维导图背景容器 */
        .mindmap-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* 思维导图节点 - 3D效果 */
        .mindmap-node {
            position: absolute;
            border-radius: 50%;
            animation: nodeFloat 6s infinite ease-in-out;
            backdrop-filter: blur(5px);
            transform-style: preserve-3d;
            box-shadow: inset 0 0 30px rgba(255, 255, 255, 0.8),
            inset 0 0 60px rgba(255, 255, 255, 0.4),
            inset -10px -10px 30px rgba(0, 0, 0, 0.15),
            0 10px 30px rgba(0, 0, 0, 0.2),
            0 20px 60px rgba(0, 0, 0, 0.1);
        }

        .mindmap-node::before {
            content: '';
            position: absolute;
            top: 15%;
            left: 20%;
            width: 25%;
            height: 15%;
            background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.9) 0%, rgba(255, 255, 255, 0.3) 50%, transparent 70%);
            border-radius: 50%;
            transform: rotate(-30deg);
        }

        .mindmap-node::after {
            content: '';
            position: absolute;
            bottom: 10%;
            right: 15%;
            width: 20%;
            height: 12%;
            background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.4) 0%, transparent 70%);
            border-radius: 50%;
            transform: rotate(20deg);
        }

        /* 五彩节点颜色 - 3D效果 */
        .mindmap-node:nth-of-type(3) {
            background: radial-gradient(circle at 30% 30%, rgba(231, 76, 60, 1), rgba(192, 57, 43, 0.9));
            box-shadow: inset 0 0 30px rgba(255, 255, 255, 0.8),
            inset 0 0 60px rgba(255, 255, 255, 0.4),
            inset -10px -10px 30px rgba(0, 0, 0, 0.15),
            0 10px 30px rgba(0, 0, 0, 0.2),
            0 20px 60px rgba(0, 0, 0, 0.1),
            0 0 40px rgba(231, 76, 60, 0.6);
        }

        .mindmap-node:nth-of-type(4) {
            background: radial-gradient(circle at 30% 30%, rgba(46, 204, 113, 1), rgba(39, 174, 96, 0.9));
            box-shadow: inset 0 0 30px rgba(255, 255, 255, 0.8),
            inset 0 0 60px rgba(255, 255, 255, 0.4),
            inset -10px -10px 30px rgba(0, 0, 0, 0.15),
            0 10px 30px rgba(0, 0, 0, 0.2),
            0 20px 60px rgba(0, 0, 0, 0.1),
            0 0 40px rgba(46, 204, 113, 0.6);
        }

        .mindmap-node:nth-of-type(5) {
            background: radial-gradient(circle at 30% 30%, rgba(241, 196, 15, 1), rgba(243, 156, 18, 0.9));
            box-shadow: inset 0 0 30px rgba(255, 255, 255, 0.8),
            inset 0 0 60px rgba(255, 255, 255, 0.4),
            inset -10px -10px 30px rgba(0, 0, 0, 0.15),
            0 10px 30px rgba(0, 0, 0, 0.2),
            0 20px 60px rgba(0, 0, 0, 0.1),
            0 0 40px rgba(241, 196, 15, 0.6);
        }

        .mindmap-node:nth-of-type(6) {
            background: radial-gradient(circle at 30% 30%, rgba(155, 89, 182, 1), rgba(142, 68, 173, 0.9));
            box-shadow: inset 0 0 30px rgba(255, 255, 255, 0.8),
            inset 0 0 60px rgba(255, 255, 255, 0.4),
            inset -10px -10px 30px rgba(0, 0, 0, 0.15),
            0 10px 30px rgba(0, 0, 0, 0.2),
            0 20px 60px rgba(0, 0, 0, 0.1),
            0 0 40px rgba(155, 89, 182, 0.6);
        }

        .mindmap-node:nth-of-type(7) {
            background: radial-gradient(circle at 30% 30%, rgba(52, 152, 219, 1), rgba(41, 128, 185, 0.9));
            box-shadow: inset 0 0 30px rgba(255, 255, 255, 0.8),
            inset 0 0 60px rgba(255, 255, 255, 0.4),
            inset -10px -10px 30px rgba(0, 0, 0, 0.15),
            0 10px 30px rgba(0, 0, 0, 0.2),
            0 20px 60px rgba(0, 0, 0, 0.1),
            0 0 40px rgba(52, 152, 219, 0.6);
        }

        .mindmap-node:nth-of-type(8) {
            background: radial-gradient(circle at 30% 30%, rgba(255, 118, 117, 1), rgba(235, 77, 75, 0.9));
            box-shadow: inset 0 0 30px rgba(255, 255, 255, 0.8),
            inset 0 0 60px rgba(255, 255, 255, 0.4),
            inset -10px -10px 30px rgba(0, 0, 0, 0.15),
            0 10px 30px rgba(0, 0, 0, 0.2),
            0 20px 60px rgba(0, 0, 0, 0.1),
            0 0 40px rgba(255, 118, 117, 0.6);
        }

        .mindmap-node:nth-of-type(9) {
            background: radial-gradient(circle at 30% 30%, rgba(85, 239, 196, 1), rgba(0, 206, 201, 0.9));
            box-shadow: inset 0 0 30px rgba(255, 255, 255, 0.8),
            inset 0 0 60px rgba(255, 255, 255, 0.4),
            inset -10px -10px 30px rgba(0, 0, 0, 0.15),
            0 10px 30px rgba(0, 0, 0, 0.2),
            0 20px 60px rgba(0, 0, 0, 0.1),
            0 0 40px rgba(85, 239, 196, 0.6);
        }

        /* 思维导图连线动画 */
        .mindmap-line {
            stroke: var(--mindmap-line);
            stroke-width: 1;
            stroke-dasharray: 800;
            animation: lineFlow 6s linear infinite;
        }

        @keyframes nodeFloat {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-20px);
            }
        }

        @keyframes lineFlow {
            from {
                stroke-dashoffset: 800;
            }
            to {
                stroke-dashoffset: 0;
            }
        }

        /* 表达式引擎主题表单 */
        .engine-container {
            position: relative;
            width: 440px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.75);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            margin: 5% auto;
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .engine-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .engine-title {
            color: #1e293b;
            font-size: 32px;
            font-weight: 600;
            background: linear-gradient(45deg, var(--primary-color), var(--formula-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* 输入框定制 */
        .layui-form-item {
            margin-bottom: 24px !important;
        }

        .layui-input {
            width: 100% !important;
            height: 48px !important;
            border: 1px solid rgba(255, 255, 255, 0.6) !important;
            border-radius: 12px !important;
            padding-left: 48px !important;
            padding-right: 16px !important;
            font-size: 15px !important;
            background: rgba(255, 255, 255, 0.6) !important;
            transition: all 0.3s !important;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05) !important;
        }

        .layui-input:focus {
            border-color: var(--primary-color) !important;
            background: rgba(255, 255, 255, 0.8) !important;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15), 0 4px 12px rgba(0, 0, 0, 0.1) !important;
        }

        .layui-input:hover {
            border-color: rgba(148, 163, 184, 0.8) !important;
            background: rgba(255, 255, 255, 0.75) !important;
        }

        .layui-input::-webkit-input-placeholder {
            color: #94a3b8 !important;
        }

        .layui-input:-moz-placeholder {
            color: #94a3b8 !important;
        }

        .layui-input::-moz-placeholder {
            color: #94a3b8 !important;
        }

        .layui-input:-ms-input-placeholder {
            color: #94a3b8 !important;
        }

        /* 用户名输入框图标 */
        .layui-form-item:first-child .layui-input {
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" fill="%2394a3b8"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0-6c1.1 0 2 .9 2 2s-.9 2-2 2-2-.9-2-2 .9-2 2-2zm0 9c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>') no-repeat 16px center !important;
            background-color: rgba(255, 255, 255, 0.6) !important;
        }

        /* 密码输入框图标 */
        .layui-form-item:nth-child(2) .layui-input {
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" fill="%2394a3b8"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6-9c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>') no-repeat 16px center !important;
            background-color: rgba(255, 255, 255, 0.6) !important;
        }

        /* 登录按钮 */
        .engine-btn {
            width: 100% !important;
            height: 48px !important;
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.9), rgba(139, 92, 246, 0.9)) !important;
            border: none !important;
            border-radius: 12px !important;
            font-size: 16px !important;
            font-weight: 600;
            letter-spacing: 1px;
            color: #fff !important;
            transition: all 0.3s !important;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.25) !important;
        }

        .engine-btn:hover {
            transform: translateY(-2px);
            background: linear-gradient(135deg, rgba(59, 130, 246, 1), rgba(139, 92, 246, 1)) !important;
            box-shadow: 0 8px 24px rgba(59, 130, 246, 0.35), 0 0 20px rgba(139, 92, 246, 0.15) !important;
        }

        .engine-btn:active {
            transform: translateY(0) !important;
        }
    </style>
</head>
<body class="bubble-bg">
<!-- 五彩气泡容器 -->
<div id="bubbleContainer"></div>

<!-- 思维导图动态背景 -->
<div class="mindmap-bg">
    <svg width="100%" height="100%">
        <path class="mindmap-line" d="M200 300 Q 400 150 600 250"/>
        <path class="mindmap-line" d="M150 450 Q 300 500 700 200"/>
    </svg>

    <!-- 添加多个节点 -->
    <!--    <div class="mindmap-node" style="width: 80px; height: 80px; top: 5%; left: 50%"></div>-->
    <!--    <div class="mindmap-node" style="width: 80px; height: 80px; top: calc(20% - 40px); left: calc(20% - 40px)"></div>-->
    <!--    <div class="mindmap-node" style="width: 80px; height: 80px; top: calc(20% - 40px); left: calc(80% - 40px)"></div>-->
    <!--    <div class="mindmap-node" style="width: 80px; height: 80px; top: calc(50% - 40px); left: calc(50% - 40px)"></div>-->
    <!--    <div class="mindmap-node" style="width: 80px; height: 80px; top: calc(80% - 40px); left: calc(20% - 40px)"></div>-->
    <!--    <div class="mindmap-node" style="width: 80px; height: 80px; top: calc(80% - 40px); left: calc(80% - 40px)"></div>-->
    <!--    <div class="mindmap-node" style="width: 80px; height: 80px; top: 65%; left: 50%"></div>-->
</div>

<!-- 登录表单 -->
<div class="engine-container">
    <form class="layui-form" id="loginForm">
        <div class="engine-header">
            <h1 class="engine-title">表达式引擎</h1>
            <p class="layui-font-14" style="color: #64748b">【动态配置+可视化+实时生效】<br/>轻松玩转复杂业务</p>
        </div>


        <div class="layui-form-item">
            <input type="text" name="username" lay-verify="required"
                   placeholder="用户名" class="layui-input">
        </div>

        <div class="layui-form-item">
            <input type="password" name="password" lay-verify="required"
                   placeholder="密码" class="layui-input">
        </div>

        <div class="layui-form-item">
            <button class="layui-btn engine-btn" lay-submit lay-filter="login">启动引擎</button>
        </div>
    </form>
</div>

<script>
    let api_login = final_const.api_path.login;

    layui.use(['form', 'layer'], function () {
        const form = layui.form;
        const layer = layui.layer;
        // 表单提交事件
        form.on('submit(login)', function (data) {
            engineUtils.requestPost(api_login, data.field, function (response) {
                if (response.code === 200) {
                    let data = response.data;
                    // 写入Cookie
                    setCookie(data['tokenName'], data['tokenValue'], data['tokenTimeoutDay']);
                    location.href = final_const.template_path.index;
                } else {
                    layer.alert(response.message);
                }
            })
            return false;
        });

        function setCookie(name, value, days) {
            let expires = '';
            if (days) {
                const date = new Date();
                date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
                expires = '; expires=' + date.toUTCString();
            }
            document.cookie = name + '=' + (value || '') + expires + '; path=/';
        }
    });
</script>
</body>
</html>
